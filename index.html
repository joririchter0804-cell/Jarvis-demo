<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis Demo</title><style>body{font:18px system-ui;background:radial-gradient(circle at top,#214b7a,#080d1b 75%);color:#eef6ff;min-height:100vh;text-align:center;padding:40px 12px}h1{margin-top:70px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,150px));justify-content:center;gap:20px;margin:60px auto}button{background:#193b65;color:white;border:1px solid #80c6ff;border-radius:100px;padding:25px 8px;font:inherit}p{color:#b9d3ec}.dashboard{max-width:800px;margin:30px auto}.welcome{text-align:left;margin:30px 0 12px}.welcome h1{margin:7px 0;font-size:clamp(32px,6vw,50px)}.welcome p{margin:0;color:#b6d0eb}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:25px 0}.tiles button{width:100%;height:135px;border-radius:18px;text-align:left;padding:16px;background:linear-gradient(135deg,#1b3a61,#13233b);display:flex;flex-direction:column;gap:6px}.tiles button strong{font-size:17px}.tiles button small{font-size:12px;color:#bdd3ed}.tiles button .emoji{font-size:26px}.tiles button:hover{border-color:white;background:#22476e}.mini{color:#8ac9ff;font-size:12px;letter-spacing:2px;font-weight:800}.space{height:290px}.detail{max-width:800px;margin:20px auto;background:#112846;border:1px solid #46739e;border-radius:18px;padding:22px}.detail h2{margin:0 0 8px}.detail p{line-height:1.6}.detail a{color:#a9ddff}.close{padding:10px 16px;border-radius:10px;font-size:14px}@media(max-width:620px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles button{height:130px}.space{height:270px}}</style><section class="dashboard"><div class="welcome"><div class="mini">DEIN PERSÖNLICHES UNIVERSUM</div><h1 id="hello">Guten Abend.</h1><p>Alle Lebensbereiche auf einen Blick.</p></div><div class="tiles"><button onclick="show('Kalender')"><span class="emoji">📅</span><strong>Kalender</strong><small>Termine & Planung</small></button><button onclick="show('Aufgaben')"><span class="emoji">✓</span><strong>Aufgaben</strong><small>Heute & diese Woche</small></button><button onclick="show('News')"><span class="emoji">◉</span><strong>Nachrichten</strong><small>Wirtschaft · KI · Politik</small></button><button onclick="show('Studium')"><span class="emoji">🎓</span><strong>Studium</strong><small>Lernen & Vorlesungen</small></button><button onclick="show('Finanzen')"><span class="emoji">€</span><strong>Finanzen</strong><small>Budget & Überblick</small></button><button onclick="show('KI-Chat')"><span class="emoji">✧</span><strong>Jarvis Chat</strong><small>Assistent öffnen</small></button></div><div class="mini">✦ STERNENANSICHT</div></section><h1 style="display:none">✦ J.A.R.V.I.S.</h1><p>Dein Universum · Öffentliche Demo ohne persönliche Daten</p><div class="grid" style="display:none"><button onclick="show('Studium')">🎓 Studium</button><button onclick="show('Kalender')">📅 Kalender</button><button onclick="show('Aufgaben')">✓ Aufgaben</button><button onclick="show('Finanzen')">€ Finanzen</button><button onclick="show('News')">◉ News</button><button onclick="show('KI-Chat')">✧ KI-Chat</button></div><section id="panel" class="detail" hidden style="max-width:570px;margin:25px auto;padding:20px;border:1px solid #80c6ff;border-radius:18px;background:#102947"><h2 id="selection">Wähle einen Stern</h2><p id="detail"></p><button onclick="document.getElementById('panel').hidden=true" style="padding:10px 22px;border-radius:12px">Zurück zur Übersicht</button></section><p>Keine Kontoverbindung · Keine KI-API · 0 € zusätzliche Kosten</p><script>document.getElementById('hello').textContent=new Date().getHours()<11?'Guten Morgen.':new Date().getHours()<18?'Guten Tag.':'Guten Abend.';function show(s){const content={Studium:'Lernziele und Skripte – in der privaten Version mit deinen Daten.',Kalender:'Termine und Schichten – ohne Veröffentlichung deiner Daten.',Aufgaben:'To-dos und Projekte – später sicher mit Notion verbunden.',Finanzen:'Budgetübersicht – keine echten Kontodaten in der Demo.',News:'Wirtschaft, KI und Politik – künftig mit Morgenbriefing.','KI-Chat':'Dein Assistent über deinen bestehenden ChatGPT-Zugang.'};document.getElementById('selection').textContent=s;document.getElementById('detail').textContent=content[s];document.getElementById('panel').hidden=false;document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'nearest'});}</script></html>

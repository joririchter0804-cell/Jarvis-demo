<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis Demo</title><style>body{font:18px system-ui;background:radial-gradient(circle at top,#214b7a,#080d1b 75%);color:#eef6ff;min-height:100vh;text-align:center;padding:40px 12px}h1{margin-top:70px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,150px));justify-content:center;gap:20px;margin:60px auto}button{background:#193b65;color:white;border:1px solid #80c6ff;border-radius:100px;padding:25px 8px;font:inherit}p{color:#b9d3ec}</style><h1>✦ J.A.R.V.I.S.</h1><p>Dein Universum · Öffentliche Demo ohne persönliche Daten</p><div class="grid"><button onclick="show('Studium')">🎓 Studium</button><button onclick="show('Kalender')">📅 Kalender</button><button onclick="show('Aufgaben')">✓ Aufgaben</button><button onclick="show('Finanzen')">€ Finanzen</button><button onclick="show('News')">◉ News</button><button onclick="show('KI-Chat')">✧ KI-Chat</button></div><section id="panel" hidden style="max-width:570px;margin:25px auto;padding:20px;border:1px solid #80c6ff;border-radius:18px;background:#102947"><h2 id="selection">Wähle einen Stern</h2><p id="detail"></p><button onclick="document.getElementById('panel').hidden=true" style="padding:10px 22px;border-radius:12px">Zurück zur Übersicht</button></section><p>Keine Kontoverbindung · Keine KI-API · 0 € zusätzliche Kosten</p><script>function show(s){const content={Studium:'Lernziele und Skripte – in der privaten Version mit deinen Daten.',Kalender:'Termine und Schichten – ohne Veröffentlichung deiner Daten.',Aufgaben:'To-dos und Projekte – später sicher mit Notion verbunden.',Finanzen:'Budgetübersicht – keine echten Kontodaten in der Demo.',News:'Wirtschaft, KI und Politik – künftig mit Morgenbriefing.','KI-Chat':'Dein Assistent über deinen bestehenden ChatGPT-Zugang.'};document.getElementById('selection').textContent=s;document.getElementById('detail').textContent=content[s];document.getElementById('panel').hidden=false;document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'nearest'});}</script></html>
